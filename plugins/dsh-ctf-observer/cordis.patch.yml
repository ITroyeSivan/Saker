# One installable bundle row: the CTF observer sidecar (host plane).
#
# BreachWeave 的三角色里 Observer 的职责是「不替你解题，只在旁路持续观察：检测异常/重复/跑偏
# → 生成修正建议 → 回推 steer / follow-up」。本插件是它在 dsh 的落地：
#   · 触发：session/event 的轮次边界（turn/end）—— 与「监督只在轮次边界出方案」一致
#   · 判据：确定性规则（重复试错 / 错误堆积 / 无进展 / flag 已捕获），不调模型
#   · 注入：agent.followup（等价 BreachWeave 的 sendUserMessage(..., {deliverAs:"steer"})）
#   · 护栏：冷却窗 + 同指纹重复窗
#   · 结束：条件外置 —— flag 由系统识别并宣布可收尾
# 只在 ctf-solver 模式生效；只注入、不拦截、不改写任何工具调用。
- insert:
    - id: dsh-ctf-observer
      name: '@dsh-external/dsh-ctf-observer'
      config:
        enable: true
