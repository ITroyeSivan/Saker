<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">Saker 桌面渗透测试工作台</title><desc id="desc">人提供目标、账号和线索，选择常规测试、Nday发现或0Day挖掘。AI围绕具体问题分析和验证，按需使用工具与资料，保存证据并交付复现材料。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c30"/><stop offset="1" stop-color="#172c40"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 1L6 4L0 7" fill="none" stroke="#6fa6c1" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="840" rx="24" fill="url(#bg)"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="64" y="81" font-size="43" font-weight="700" fill="#f4f8fc">Saker · 猎隼</text><text x="66" y="120" font-size="22" fill="#b7c9db">dsh Desktop 渗透测试工作台</text>
<rect x="1102" y="52" width="274" height="46" rx="23" fill="#263c52"/><text x="1239" y="82" text-anchor="middle" font-size="20" fill="#c7e4f0">一个问题，深入验证</text>
<rect x="64" y="161" width="1312" height="102" rx="18" fill="#22374b" stroke="#3f5769"/>
<text x="96" y="205" font-size="24" font-weight="700" fill="#ffffff">你提供</text><text x="255" y="205" font-size="24" fill="#e6f0f8">目标与范围</text><text x="568" y="205" font-size="24" fill="#e6f0f8">账号与请求</text><text x="932" y="205" font-size="24" fill="#e6f0f8">业务说明与已有线索</text>
<text x="255" y="239" font-size="18" fill="#a9bed1">一个站、一个接口或一个业务流程</text><text x="568" y="239" font-size="18" fill="#a9bed1">角色、正常流量、测试对象</text><text x="932" y="239" font-size="18" fill="#a9bed1">本轮想确认的具体问题</text>
<path d="M720 266V296" stroke="#6fa6c1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="308" width="416" height="156" rx="18" fill="#e5f2ed"/><rect x="512" y="308" width="416" height="156" rx="18" fill="#e6eefc"/><rect x="960" y="308" width="416" height="156" rx="18" fill="#f0eafa"/>
<text x="96" y="354" font-size="27" font-weight="700" fill="#185b47">常规测试</text><text x="96" y="394" font-size="21" fill="#273f39">沿接口与业务流程检查问题</text><text x="96" y="429" font-size="18" fill="#4b675e">权限、输入、角色与实际影响</text>
<text x="544" y="354" font-size="27" font-weight="700" fill="#3056a0">Nday 发现</text><text x="544" y="394" font-size="21" fill="#2d405f">按产品和版本查公开漏洞</text><text x="544" y="429" font-size="18" fill="#526788">更新来源、核对条件、再验证</text>
<text x="992" y="354" font-size="27" font-weight="700" fill="#7046a2">0Day 挖掘</text><text x="992" y="394" font-size="21" fill="#47365f">深入一个站，追踪新问题</text><text x="992" y="429" font-size="18" fill="#715d87">页面、JS、接口与业务关系</text>
<path d="M272 466V492H720M1168 466V492H720M720 466V513" fill="none" stroke="#6fa6c1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="527" width="1312" height="94" rx="18" fill="#243d52" stroke="#3f6077"/>
<text x="96" y="566" font-size="24" font-weight="700" fill="#ffffff">AI 推进</text><text x="255" y="566" font-size="23" fill="#e5f3ff">分析材料 → 提出假设 → 比较请求 → 验证影响 → 保存证据</text>
<text x="255" y="601" font-size="18" fill="#b6cfdf">小任务直接做 · 确有需要再分子任务 · 缺资料或访问受阻时与你确认</text>
<rect x="64" y="655" width="416" height="121" rx="16" fill="#1c3042" stroke="#3d5264"/><rect x="512" y="655" width="416" height="121" rx="16" fill="#1c3042" stroke="#3d5264"/><rect x="960" y="655" width="416" height="121" rx="16" fill="#1c3042" stroke="#3d5264"/>
<text x="96" y="695" font-size="22" font-weight="700" fill="#d7eaf7">资料与工具</text><text x="96" y="731" font-size="18" fill="#adc4d7">知识库 / 情报源 / 本机工具 / MCP</text><text x="96" y="757" font-size="17" fill="#89a9bf">按问题选用，减少重复读取</text>
<text x="544" y="695" font-size="22" font-weight="700" fill="#d7eaf7">任务与记录</text><text x="544" y="731" font-size="18" fill="#adc4d7">预算 / 操作日志 / 站点子任务 / 恢复</text><text x="544" y="757" font-size="17" fill="#89a9bf">看清进度，及时收尾与清理</text>
<text x="992" y="695" font-size="22" font-weight="700" fill="#d7eaf7">复现与交付</text><text x="992" y="731" font-size="18" fill="#adc4d7">请求与响应 / 实际效果 / 报告与材料包</text><text x="992" y="757" font-size="17" fill="#89a9bf">疑点继续核对，结论附带证据</text>
</g></svg>
